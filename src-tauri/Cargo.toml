[package]
name = "pms"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "pms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
atomicwrites = "0.4"
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
aes-gcm = "0.10.3"
hkdf = "0.12.4"
sha2 = "0.10.9"
hex = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
rand = "0.8.5"
unicode-normalization = "0.1.24"
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "ecdsa", "encryption", "p256", "p384", "p521"] }
rsa = { version = "0.9.8", features = ["pem", "sha2"] }
ed25519-dalek = { version = "2.2.0", features = ["pem"] }
p256 = { version = "0.13.2", features = ["pem", "pkcs8"] }
p384 = { version = "0.13", features = ["pem", "pkcs8"] }
p521 = { version = "0.13", features = ["pem", "pkcs8"] }
pkcs8 = { version = "0.10.2", features = ["pem"] }

[dev-dependencies]
tempfile = "3"
