# cargo-deny policy. `cargo deny check advisories bans sources licenses`.

[advisories]
# Every ignore needs a reason and a revisit date; the CI job fails on anything
# new.
ignore = [
  # Marvin attack (timing side channel in RSA *decryption*). PMS uses `rsa`
  # only to generate keys and to serialize them (SSH export, keyfile
  # canonicalization); no attacker-supplied ciphertext is ever decrypted.
  # Revisit when ssh-key ships a release built on rsa 0.10.
  "RUSTSEC-2023-0071",
  # Constant-time issues in crypto-bigint / ctutils, pulled in by the RustCrypto
  # curve crates (p256/p384/p521, rsa 0.9). Upgrading means moving the whole
  # family to 0.14/0.10 with a new pkcs8; the exposed operations here are local
  # key generation and DER encoding, not remote timing oracles.
  "RUSTSEC-2026-0387",
  "RUSTSEC-2026-0385",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A password manager should not gain a second HTTP stack or another TLS
# implementation by accident.
deny = [
  { name = "openssl" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "Unlicense"]
confidence-threshold = 0.9
