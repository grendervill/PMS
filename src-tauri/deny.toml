# cargo-deny policy. `cargo deny check advisories bans sources licenses`.

[advisories]
# Every ignore needs a reason and a revisit date; the CI job fails on anything
# new.
ignore = [
  # Marvin attack (timing side channel in RSA *decryption*). PMS uses `rsa`
  # only to generate keys and to serialize them (SSH export, keyfile
  # canonicalization); no attacker-supplied ciphertext is ever decrypted.
  # Revisit when ssh-key ships a release built on rsa 0.10.
  "RUSTSEC-2023-0071",
  # Constant-time issues in crypto-bigint / ctutils, pulled in by the RustCrypto
  # curve crates (p256/p384/p521, rsa 0.9). Upgrading means moving the whole
  # family to 0.14/0.10 with a new pkcs8; the exposed operations here are local
  # key generation and DER encoding, not remote timing oracles.
  "RUSTSEC-2026-0387",
  # chrono объявлен unmaintained (фикса нет). Он нужен для RFC3339-метк времени
  # на клиенте и в сервере, используется по прямому назначению и не парсит
  # недоверенные форматы дат. Замена на `time` — отдельная задача миграции.
  "RUSTSEC-2026-0543",
  # Linux-стек Tauri: glib/gtk приходят через `muda` (меню) и webkit2gtk.
  # Наш код glib не вызывает; advisory про VariantStrIter в биндингах.
  # Снимется вместе с обновлением gtk-rs в Tauri.
  "RUSTSEC-2024-0429",
  # proc-macro-error тянется glib-macros (см. выше), только для Linux-сборки.
  "RUSTSEC-2024-0370",
  # D-Bus стек tauri-plugin-opener (Linux). Мы вызываем только `opener::open`.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A password manager should not gain a second HTTP stack or another TLS
# implementation by accident.
deny = [
  { name = "openssl" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "Unlicense", "BSL-1.0", "bzip2-1.0.6", "CDLA-Permissive-2.0", "GPL-3.0-or-later", "GPL-3.0-only"]
confidence-threshold = 0.9
