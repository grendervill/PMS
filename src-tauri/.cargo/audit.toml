# cargo-audit configuration (run from `src-tauri/`).
#
# Ignored advisories must match `deny.toml` and carry a reason:
#  * RUSTSEC-2023-0071 (rsa Marvin) — the `rsa` crate is used for key
#    generation and DER serialization only; nothing decrypts attacker input.
#  * RUSTSEC-2026-0387 (crypto-bigint 0.5.5) — constant-time issues in the
#    RustCrypto curve stack. Only 0.7.x is patched, which needs
#    p256/p384/p521 0.14 + rsa 0.10 + pkcs8 0.11 in one step; `ssh-key 0.6.7`
#    still pins rsa 0.9, so the chain cannot move yet.
#  (ctutils was upgraded to 0.4.8, so RUSTSEC-2026-0385 no longer applies.)
[advisories]
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0387",
]
