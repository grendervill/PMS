# cargo-audit configuration (run from `src-tauri/`).
#
# Ignored advisories must match `deny.toml` and carry a reason:
#  * RUSTSEC-2023-0071 (rsa Marvin) — the `rsa` crate is used for key
#    generation and DER serialization only; nothing decrypts attacker input.
#  * RUSTSEC-2026-0387 / 0385 (crypto-bigint, ctutils) — constant-time issues
#    in the RustCrypto curve stack; same reasoning, and upgrading requires
#    moving p256/p384/p521/rsa to the 0.14/0.10 generation in one step.
[advisories]
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0387",
  "RUSTSEC-2026-0385",
]
