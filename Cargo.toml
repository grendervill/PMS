[workspace]
resolver = "2"
members = ["src-tauri", "crates/pms-proto", "crates/pms-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

# Сервер собирается отдельным профилем, чтобы жирный LTO не замедлял
# релизные сборки приложения (macOS/Windows/Linux/Android в CI).
[profile.server]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
