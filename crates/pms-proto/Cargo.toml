[package]
name = "pms-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared PMS wire protocol: identity keys, DTOs, error codes"

[dependencies]
argon2 = { version = "0.5.3", features = ["zeroize"] }
blake3 = "1"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1.9", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
