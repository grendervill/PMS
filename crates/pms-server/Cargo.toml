[package]
name = "pms-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "PMS sync server: sealed vault and blob storage with quotas"

[[bin]]
name = "pms-server"
path = "src/main.rs"

[dependencies]
pms-proto = { path = "../pms-proto" }
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2"
chrono = { version = "0.4", features = ["serde"] }
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
