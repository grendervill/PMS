[server]
data_dir = "/var/lib/pms"
listen = "0.0.0.0:8443"

[tls]
required = true
mode = "files"
cert_path = "/etc/pms/server.crt"
key_path = "/etc/pms/server.key"
min_version = "1.3"

[quota]
default_bytes = 1073741824

[registration]
enabled = true
max_per_minute = 30
token = ""

[auth]
token_ttl_hours = 12
max_sessions_per_account = 5
challenge_ttl_seconds = 60

[limits]
max_body_bytes = 1073741824
max_connections = 512
header_read_timeout_secs = 10
body_timeout_secs = 300
